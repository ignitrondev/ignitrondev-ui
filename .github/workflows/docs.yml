name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish catalog
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build registry & catalog
        run: bun run build:registry && bun --cwd apps/docs build
        env:
          DOCS_BASE: /ignitrondev-ui/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

      - id: deployment
        uses: actions/deploy-pages@v4
